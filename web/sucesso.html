<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Confirmação de pedido na Loja Impossível.">
  <title>Loja Impossível | Pedido Concluído</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo principal</a>
  <header class="site-header">
    <nav class="navbar" aria-label="Navegação principal">
      <div class="container"><a class="navbar-brand fw-bold" href="index.html">Loja Impossível</a></div>
    </nav>
  </header>

  <main id="conteudo" class="container py-5 flex-grow-1 d-flex align-items-center">
    <section class="success-panel mx-auto text-center w-100" aria-labelledby="titulo-sucesso">
      <div class="success-icon" aria-hidden="true">✓</div>
      <p class="eyebrow">Pedido Registrado</p>
      <h1 id="titulo-sucesso">Compra realizada com sucesso!</h1>
      <p class="lead" id="mensagemCliente">Obrigado pela preferência. Seu pedido já está sendo preparado no multiverso.</p>
      <dl class="order-data">
        <div><dt>Número do pedido</dt><dd id="numeroPedido">PED-000000</dd></div>
        <div><dt>Status</dt><dd>Em separação</dd></div>
      </dl>
      <a class="btn btn-dark" href="index.html">Voltar para a loja</a>
    </section>
  </main>

  <footer class="site-footer py-4 mt-auto">
    <div class="container text-center"><p class="mb-0">Loja Impossível · Todos os direitos reservados.</p></div>
  </footer>
  <script src="js/success.js"></script>
</body>
</html>
